appId: com.bassamsalah.recall
name: 04_folders
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-notes"
    timeout: 15000
- tapOn:
    id: "tab-notes"
- tapOn:
    id: "add-folder"
- inputText: "Work"
- tapOn: "Create"
- assertVisible:
    id: "folder-Work"
- tapOn:
    id: "folder-Work"
- assertVisible: "No notes in Work"
- tapOn:
    id: "new-note"
- waitForAnimationToEnd
- tapOn:
    id: "note-title"
- inputText: "Quarterly report"
- tapOn:
    id: "editor-done"
- assertVisible:
    id: "row-Quarterly report"
- takeScreenshot: screenshots/04-folder

# Move a note into the folder from the editor
- tapOn:
    id: "folder-all"
- tapOn:
    id: "row-Groceries list"
- waitForAnimationToEnd
- tapOn:
    id: "folder-pill"
- tapOn: "Work"
- tapOn:
    id: "editor-done"
- tapOn:
    id: "folder-Work"
- assertVisible:
    id: "row-Groceries list"

# Rename, then delete the folder (notes are kept)
- longPressOn:
    id: "folder-Work"
- tapOn: ".*Rename"
- eraseText: 10
- inputText: "Office"
- tapOn: "Save"
- assertVisible:
    id: "folder-Office"
- longPressOn:
    id: "folder-Office"
- tapOn: ".*Delete Folder"
- tapOn:
    text: "Delete Folder"
    rightOf: "Cancel"
- assertNotVisible:
    id: "folder-Office"
- assertVisible:
    id: "row-Quarterly report"
