appId: com.bassamsalah.recall
name: 03_reminders
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-reminders"
    timeout: 15000
- tapOn:
    id: "tab-reminders"

# New reminder from the Reminders tab opens the date picker straight away
- tapOn:
    id: "new-reminder"
- extendedWaitUntil:
    visible:
      id: "date-confirm"
    timeout: 5000
- takeScreenshot: screenshots/03-date-sheet
- tapOn: "Tomorrow 9 AM"
- tapOn:
    id: "date-confirm"
- waitForAnimationToEnd
- assertVisible: ".*Tomorrow, 9:00.AM.*"
- tapOn:
    id: "note-title"
- inputText: "Dentist"
- tapOn:
    id: "note-body"
- inputText: "Bring the insurance card"

# A second reminder on the same note
- tapOn:
    id: "add-reminder"
- extendedWaitUntil:
    visible:
      id: "date-confirm"
    timeout: 5000
- tapOn: "Next week"
- tapOn:
    id: "date-confirm"
- waitForAnimationToEnd

# First reminder: alarm, weekly
- tapOn:
    id: "alert-toggle"
    index: 0
- runFlow: ../subflows/system_prompts.yaml
- assertVisible: ".*Alarm"
- tapOn:
    id: "repeat-pill"
    index: 0
- tapOn: "Weekly"
- assertVisible: ".*Weekly"
- takeScreenshot: screenshots/03-editor-reminders
- tapOn:
    id: "editor-done"

# Both reminders show in the list, grouped by day
- assertVisible: "Tomorrow"
- assertVisible: "Later"
- takeScreenshot: screenshots/03-reminders

# Tapping a reminder shows its note inline
- tapOn:
    id: "reminder-Dentist"
    index: 0
- assertVisible:
    id: "reminder-note-body"
- assertVisible: "Bring the insurance card"
- takeScreenshot: screenshots/03-reminder-expanded
- tapOn:
    id: "reminder-open"
- waitForAnimationToEnd
- assertVisible:
    id: "editor-reminder"
    index: 1
- tapOn:
    id: "editor-done"

# A one-off reminder, completed from the list
- tapOn:
    id: "new-reminder"
- extendedWaitUntil:
    visible:
      id: "date-confirm"
    timeout: 5000
- tapOn: "Next week"
- tapOn:
    id: "date-confirm"
- waitForAnimationToEnd
- tapOn:
    id: "note-title"
- inputText: "Take out trash"
- tapOn:
    id: "editor-done"
- tapOn:
    id: "complete-Take out trash"
- assertNotVisible:
    id: "reminder-Take out trash"
- tapOn:
    id: "filter-done"
- assertVisible:
    id: "reminder-Take out trash"
- takeScreenshot: screenshots/03-done
- tapOn:
    id: "filter-upcoming"

# Completing the weekly reminder moves it on instead of finishing it
- tapOn:
    id: "complete-Dentist"
    index: 0
- extendedWaitUntil:
    visible: "Next:.*"
    timeout: 5000

# The Notes tab shows each note's reminders
- tapOn:
    id: "tab-notes"
- assertVisible: "Dentist, Bring the insurance card, reminder.*reminder.*"
- takeScreenshot: screenshots/03-notes-with-reminders

# Removing one reminder keeps the note and the other reminder
- tapOn:
    id: "row-Dentist"
- waitForAnimationToEnd
- tapOn:
    id: "reminder-delete"
    index: 0
- assertNotVisible:
    id: "editor-reminder"
    index: 1
- assertVisible:
    id: "editor-reminder"
- tapOn:
    id: "editor-done"
- assertVisible:
    id: "row-Dentist"
