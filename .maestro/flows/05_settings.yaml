appId: com.bassamsalah.recall
name: 05_settings
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-settings"
    timeout: 15000
- tapOn:
    id: "tab-settings"
- assertVisible: "Settings"
- assertVisible: ${EMAIL}
- scrollUntilVisible:
    element:
      text: "Allowed"
- assertVisible: "Allowed"
- takeScreenshot: screenshots/05-settings

# Appearance: force dark, check the main screens, then force light
- tapOn:
    id: "appearance-dark"
- takeScreenshot: screenshots/05-settings-dark
- tapOn:
    id: "tab-reminders"
- takeScreenshot: screenshots/05-reminders-dark
- tapOn:
    id: "tab-notes"
- takeScreenshot: screenshots/05-notes-dark
- tapOn:
    id: "row-Dentist"
- waitForAnimationToEnd
- takeScreenshot: screenshots/05-editor-dark
- tapOn:
    id: "editor-done"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "tab-settings"
    timeout: 10000
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "appearance-light"
- takeScreenshot: screenshots/05-settings-light
- tapOn:
    id: "appearance-system"

- scrollUntilVisible:
    centerElement: true
    element:
      id: "test-notification"
- tapOn:
    id: "test-notification"
- assertVisible: "Test notification in 5 seconds.*"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "sign-out"
- tapOn:
    id: "sign-out"
- tapOn: "Cancel"
- assertVisible: "Settings"
- tapOn:
    id: "sign-out"
- tapOn:
    text: "Sign Out"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 10000
