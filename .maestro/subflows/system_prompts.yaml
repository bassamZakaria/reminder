appId: com.bassamsalah.recall
---
- runFlow:
    when:
      visible: ".*schedule alarms and timers.*"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Ring exactly on time?"
    commands:
      - tapOn: "(?i)not now"
