name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -f -o /dev/null "$SUPABASE_URL/rest/v1/lists?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY"
